# Reconstructed copy of the live Ollama systemd drop-in for disaster recovery.
# Live location on gpu-llm: /etc/systemd/system/ollama.service.d/override.conf
# Captured 2026-07-07 from `systemctl cat ollama` (the live file requires root to read directly).
# To restore: recreate at the live path above, then `sudo systemctl daemon-reload && sudo systemctl restart ollama`.
[Service]
Environment="OLLAMA_NUM_THREADS=6"
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_NUM_PARALLEL=2"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
